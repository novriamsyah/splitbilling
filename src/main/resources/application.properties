spring.application.name=splitbill

server.port=9000

# PostgreSQL Neon
spring.datasource.url=jdbc:postgresql://ep-holy-block-ai9pc8zz-pooler.c-4.us-east-1.aws.neon.tech/novri?sslmode=require&channel_binding=require&currentSchema=tugas
spring.datasource.username=neondb_owner
spring.datasource.password=npg_s4IN9jyKFvfJ

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=tugas

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migrations
spring.flyway.default-schema=tugas
spring.flyway.schemas=tugas
spring.flyway.create-schemas=true
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

# SWAGGER / OPENAPI CONFIGURATION
# ==========================================

# Swagger UI URL
springdoc.swagger-ui.path=/swagger-ui.html
# OpenAPI JSON URL
springdoc.api-docs.path=/v3/api-docs
# Scan controller package
springdoc.packages-to-scan=com.novri.splitbill.controller
# API endpoint yang didokumentasikan
springdoc.paths-to-match=/api/**